site_name: Orbis Documentation
site_description: Diagnostic and reporting tool for Astro Private Cloud
docs_dir: docs

theme:
    name: material
    features:
      - announce.dismiss
      - content.action.edit
      - content.action.view
      - content.code.annotate
      - content.code.copy
      - content.code.select
      - content.tooltips
      - navigation.expand
      - navigation.footer
      - navigation.indexes
      - navigation.instant
      - navigation.instant.prefetch
      - navigation.instant.progress
      - navigation.sections
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.top
      - navigation.tracking
      - search.highlight
      - search.share
      - search.suggest
      - toc.follow
      - toc.integrate

    logo: assets/orbis_logo.png
    favicon: assets/orbis_icon.png

    palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    font:
      text: Inter
      code: Roboto Mono

nav:
  - Home: index.md
  - Get started:
    - Install orbis: get-started/install.md
    - Configure orbis: get-started/configure.md
  - Reporting:
    - Generate a compute report: reporting/generate-report.md
    - Report CLI reference: reporting/cli-reference.md
    - Manual Prometheus diagnostics: reporting/manual-prometheus-diagnostics.md
  - Scanner:
    - Create a support bundle: scanner/create-support-bundle.md
    - Collect from multi-cluster environments: scanner/multi-cluster-guide.md
    - Resume and merge sessions: scanner/resume-sessions.md
    - Scanner CLI reference: scanner/cli-reference.md
  - Changelog: changelog.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - exclude:
      glob:
        - development/*
        - legacy/*
        - reference/*
        - reporting/kubernetes-pod-metrics.md
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - macros
  - redirects:
      redirect_maps:
        installation.md: get-started/install.md
        configuration.md: get-started/configure.md
        usage/software_reports.md: reporting/generate-report.md
        usage/software_reporting.md: reporting/generate-report.md
        usage/software_diagnostics.md: scanner/create-support-bundle.md
        cli.md: scanner/cli-reference.md
        cli/report.md: reporting/cli-reference.md
        cli/scanner.md: scanner/cli-reference.md
        multi-cluster-guide.md: scanner/multi-cluster-guide.md
        reports.md: reporting/generate-report.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  is_external: true
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
